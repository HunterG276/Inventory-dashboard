<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Overall Container-->
    <div class="page-container">

        <!--Sidebar-->
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#">Dashboard</a> </li>
                    <li><a href="#">Inventory</a> </li>
                    <li><a href="#">Product Management</a> </li>
                    <li><a href="#">Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!--Heading/Main Content-->
        <div class="content-container">
            <header>
                <h1>Inventory Dashboard</h1>
            </header>

            <main>

                <!--search-->
                <input type="search" id="search-products" placeholder="Search Products...">

                <!--Inventory List and Calculations-->
                <div class="product-list"></div>
                <div class="total-inventory-cost"></div>
                <div class="potential-sales"></div>
                <div class="low-stock-items"></div>

                <!--Add New Product Form-->
                <form class="add-new-product">
                    <h3>Add New Product</h3>
                    <label for="product-name">Product Name:</label>
                    <input type="text" id="product-name">

                    <label for="product-cost">Product Cost ($):</label>
                    <input type="number" id="product-cost" step="0.01">

                    <label for="product-price">Selling Price ($):</label>
                    <input type="number" id="product-price" step="0.01">

                    <label for="product-stock">Stock Quantity:</label>
                    <input type="number" id="product-stock">

                    <label for="minimum-stock">Minimum Stock:</label>
                    <input type="number" id="minimum-stock">

                    <button type="submit">Add Product</button>
                </form>

           </main>
        </div>

    </div>


    <script src="script.js"></script>
</body>
</html>
